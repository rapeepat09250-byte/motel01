<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ชำระเงิน – TicketNow</title><link rel="stylesheet" href="style.css"></head><body>
<header></header>
<main><div class="wrap"><a class="crumb" href="javascript:history.back()">‹ กลับไปแก้ไขการจอง</a>
<div class="layout" id="page"><div>
 <div class="panel"><h3>ข้อมูลผู้จอง</h3>
  <label for="name">ชื่อ-นามสกุล</label><input id="name" autocomplete="name">
  <label for="email">อีเมลสำหรับรับบัตร</label><input id="email" type="email" autocomplete="email">
  <label for="phone">เบอร์โทรศัพท์</label><input id="phone" type="tel" autocomplete="tel"></div>
 <div class="panel"><h3>วิธีชำระเงิน</h3>
  <div class="tabs"><button aria-pressed="true" data-m="card">บัตรเครดิต</button><button aria-pressed="false" data-m="qr">พร้อมเพย์ QR</button></div>
  <div id="card"><label for="cn">หมายเลขบัตร</label><input id="cn" inputmode="numeric" placeholder="0000 0000 0000 0000"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label for="ex">วันหมดอายุ</label><input id="ex" placeholder="MM/YY"></div><div><label for="cv">CVV</label><input id="cv" inputmode="numeric" maxlength="3"></div></div></div>
  <div id="qr" class="hidden"><p class="meta" style="margin-top:12px">กดยืนยันเพื่อสร้าง QR Code สำหรับสแกนชำระเงิน (ตัวอย่าง)</p></div>
 </div></div>
<aside class="panel"><h3>สรุปคำสั่งซื้อ</h3><p class="meta" id="ev"></p><div id="items"></div><div class="row total"><span>ยอดชำระ</span><span id="total"></span></div><p id="err" class="meta" style="color:#c0264f;margin-top:10px" role="alert"></p><button class="btn dark" id="pay" style="width:100%;margin-top:8px">ยืนยันและชำระเงิน</button></aside>
</div></div></main>
<footer></footer>
<script src="app.js"></script>
<script>
const o=loadOrder();let method='card';
if(!o){page.innerHTML='<div class="panel success"><h2>ยังไม่มีรายการจอง</h2><p>กรุณาเลือกคอนเสิร์ตก่อน</p><br><a class="btn" href="index.html">ไปหน้าหลัก</a></div>'}else{
 const sum=o.items.reduce((s,i)=>s+i.price*i.qty,0);
 ev.textContent=o.concert+' · '+o.date;
 items.innerHTML=o.items.map(i=>`<div class="row"><span>${i.name} × ${i.qty}</span><span>${fmt(i.price*i.qty)}</span></div>`).join('');total.textContent=fmt(sum);
 document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;method=b.dataset.m;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));card.classList.toggle('hidden',method!=='card');qr.classList.toggle('hidden',method!=='qr')};
 pay.onclick=()=>{
  if(!name.value.trim()||!/\S+@\S+\.\S+/.test(email.value)||!phone.value.trim()){err.textContent='กรอกชื่อ อีเมลที่ถูกต้อง และเบอร์โทรให้ครบ';return}
  if(method==='card'&&(cn.value.replace(/\s/g,'').length<16||!ex.value||cv.value.length<3)){err.textContent='ตรวจสอบข้อมูลบัตรอีกครั้ง';return}
  const ref='TN'+Date.now().toString().slice(-8);
  page.innerHTML=`<div class="panel success" style="grid-column:1/-1"><h2>จองสำเร็จ</h2><p>เลขที่การจอง <b>${ref}</b></p><p class="meta">เราส่งบัตรไปที่ ${email.value} แล้ว</p><br><a class="btn" href="index.html">กลับหน้าหลัก</a></div>`;
  try{sessionStorage.removeItem('order')}catch(e){}};
}
</script></body></html>
